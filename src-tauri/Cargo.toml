[package]
name = "book-tracker"
version = "0.0.1"
edition = "2021"
description = "下位书籍追踪器 (P0 scaffold)"
authors = ["you"]
license = "MIT"

[lib]
name = "book_tracker_lib"
# 只桌面端:仅 rlib(供二进制链接)。cdylib / staticlib 是给移动端(iOS .a / Android .so)的,
# 但 cdylib 在 Windows GNU 链接大项目时会撞 export ordinal 上限(>65535)。
# 如果将来要做 iOS/Android,再加 cdylib + staticlib。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 core (桌面 / 移动统一入口)
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
