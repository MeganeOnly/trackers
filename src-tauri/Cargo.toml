[package]
name = "book-tracker"
version = "0.0.1"
edition = "2021"
description = "下位书籍追踪器 (P0 scaffold)"
authors = ["you"]
license = "MIT"

[lib]
name = "book_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 core (桌面 / 移动统一入口)
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
