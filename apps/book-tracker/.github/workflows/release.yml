name: Release

# 触发:推送形如 v0.1.0 的 tag 时自动构建 Windows NSIS installer,
# 并创建 draft GitHub Release(需手动 review 后 publish)。

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    permissions:
      contents: write  # 创建 / 更新 release 需要
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # tauri-action@v0 会自动:
      # 1. 装 stable Rust toolchain(MSVC target,windows-latest runner 自带 MSVC)
      # 2. 下载 webview2 runtime
      # 3. 跑 npm install + npm run build:tauri
      # 4. 从 src-tauri/target/release/bundle/nsis/ 找 .exe 装到 release
      # 5. 创建 draft release(默认)
      - name: Build & draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BookTracker ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
